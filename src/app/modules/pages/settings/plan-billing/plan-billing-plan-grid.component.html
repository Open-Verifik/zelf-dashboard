<div class="mb-8">
	@if (heading === 'upgrade') {
		<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
			<h3 class="text-lg font-semibold tracking-tight text-gray-900 dark:text-white sm:text-xl">
				{{ "saving_operations.plan_billing_page.available_upgrades.title" | transloco }}
			</h3>
			<button mat-button type="button" color="warn" class="!-ml-2 shrink-0 self-start sm:self-auto" (click)="onCancelUpgrade()">
				<mat-icon>close</mat-icon>
				{{ "saving_operations.plan_billing_page.available_upgrades.cancel" | transloco }}
			</button>
		</div>
	} @else if (heading === 'select') {
		<h3 class="mb-6 text-lg font-semibold tracking-tight text-gray-900 dark:text-white sm:text-xl">
			{{ "saving_operations.plan_billing_page.select_plan" | transloco }}
		</h3>
	}

	<!-- Mobile: horizontal snap strip; sm+: 2 cols; xl+: 3 cols -->
	<div
		class="flex snap-x snap-mandatory gap-4 overflow-x-auto overflow-y-visible pb-2 pt-1 [-ms-overflow-style:none] [scrollbar-width:none] [&::-webkit-scrollbar]:hidden sm:grid sm:snap-none sm:grid-cols-2 sm:gap-6 sm:overflow-visible sm:pb-0 sm:pt-0 xl:grid-cols-3 xl:gap-8"
	>
		<ng-content />
	</div>
</div>
